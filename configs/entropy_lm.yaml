# entropy patching 用の小型バイト LM (ByteLM) の学習設定
# 使い方:
#   python -m src.train.train --config configs/entropy_lm.yaml
#   -> checkpoints/entropy_lm/latest を arbor 側の model.entropy_model_ckpt に指定
#
# データ混合は本走 (arbor.yaml) ベース + 日英の文体多様化 (下記)。
# max_bytes は本体の max_bytes 以上にすること (next_byte_entropy は本体の
# 入力列を一発で通すため、RoPE バッファが本体の context をカバーする必要がある)。
# 32768 にしてあるので 32k 拡張 run でもそのまま使える。ただし学習 context は
# 8192 なので位置 8192 以降は RoPE 外挿になる (entropy 境界は局所文脈で決まる
# ためほぼ無害だが、32k で entropy patching を本気で使うなら context_length:
# 32768 で再学習するのが確実)。

run_name: entropy_lm
seed: 2

model:
  arch: byte_lm             # 小型 causal バイト LM (Arbor 本体ではない)
  vocab_size: 260
  max_bytes: 32768          # 本体 (8k 本走 / 32k 拡張) の max_bytes 以上にする
  hidden_size: 512
  num_heads: 8
  num_kv_heads: 4
  intermediate_size: 1536
  num_hidden_layers: 6
  rope_theta: 10000.0
  bitnet: false             # 境界判定用なので FP の通常 Transformer
  gradient_checkpointing: false

# 本走 (arbor.yaml) の混合の上位集合: ByteLM はトークナイザ相当で
# 本体学習開始後は差し替え不可なので、文体カバレッジは広めに取る。
# 日本語は最低 55% を維持し、その中に日本語チャット/崩れ文も入れる。
# 残りで英語・多言語 UTF-8・会話/typo/絵文字・
# code/markdown/math/TeX/mermaid を混ぜる。HF の text 列に残っている改行・タブ・空白・
# 絵文字・顔文字は UTF-8 bytes としてそのまま学習される。
# packing は本走と同じ document (doc EOS doc EOS ...)。concat だと EOS を一度も
# 見ないまま本体の document packed 入力に使われ、EOS 直後の entropy が未学習になる。
# 混合を変えたら resume せず新規学習すること (dataloader 状態が合わなくなる)。
data:
  sources:
    # ---- 日本語 0.55 ----
    - path: "HuggingFaceFW/fineweb-2"   # 現代 web
      name: "jpn_Jpan"
      weight: 0.28
    - path: "range3/cc100-ja"           # web 口語 (ブログ調)
      weight: 0.055
    - path: "globis-university/aozorabunko-clean"  # 青空文庫: 書籍・古典・旧文体
      weight: 0.055
    - path: "wikimedia/wikipedia"       # 百科事典文体
      name: "20231101.ja"
      weight: 0.04
    - path: "y2lan/japan-law"           # 法令 (条文体。8.75k 件と小さいが循環)
      text_column: "body"
      weight: 0.035
    - path: "shidowake/chatbot-arena-ja_dedup_subset-5k"  # 日本語チャット/崩れた入力
      weight: 0.045
    - path: "sirgecko/dataset_japanesechatbot2"  # 日本語チャット文
      weight: 0.02
    - path: "sirgecko/dataset_japanesechatbot_sentence"  # 日本語短文チャット
      weight: 0.02
    # ---- 英語 0.10 ----
    - path: "HuggingFaceFW/fineweb-edu" # edu (高品質土台)
      weight: 0.06
    - path: "manu/project_gutenberg"    # 古典書籍
      split: "en"
      weight: 0.025
    - path: "vblagoje/cc_news"          # news
      weight: 0.015
    # ---- 多言語 UTF-8 web 0.10 ----
    - path: "HuggingFaceFW/fineweb-2"   # 韓国語
      name: "kor_Hang"
      weight: 0.015
    - path: "HuggingFaceFW/fineweb-2"   # ドイツ語
      name: "deu_Latn"
      weight: 0.015
    - path: "HuggingFaceFW/fineweb-2"   # フランス語
      name: "fra_Latn"
      weight: 0.014
    - path: "HuggingFaceFW/fineweb-2"   # スペイン語
      name: "spa_Latn"
      weight: 0.014
    - path: "HuggingFaceFW/fineweb-2"   # 中国語
      name: "cmn_Hani"
      weight: 0.014
    - path: "HuggingFaceFW/fineweb-2"   # ロシア語
      name: "rus_Cyrl"
      weight: 0.014
    - path: "HuggingFaceFW/fineweb-2"   # アラビア語
      name: "arb_Arab"
      weight: 0.014

    # ---- 会話 / typo / 絵文字 / markdown 応答 0.06 ----
    - path: "OpenAssistant/oasst1"      # 多言語チャット。崩れた文・顔文字・絵文字も含む
      weight: 0.05
    - path: "nvidia/HelpSteer2"         # 英語 LLM 応答 (見出し・箇条書き・コードフェンス等の markdown)
      text_column: "response"
      weight: 0.01
    # ---- code / markdown / math / TeX / mermaid 0.19 ----
    # 本走 (arbor.yaml) には生ソースコード・.tex 文書・mermaid が無いが、ByteLM は
    # 境界判定器 = トークナイザ相当なので本走に入れない記法も一通り見せておく
    # (2026-09-16 追加。全て HF API で gated=False を確認済み)。
    - path: "OpenCoder-LLM/opc-fineweb-code-corpus"  # コード解説系 web 文書
      weight: 0.04
    - path: "OpenCoder-LLM/opc-annealing-corpus"     # 多言語コード + ```lang フェンス付き解説
      name: "algorithmic_corpus"
      weight: 0.03
    - path: "OpenCoder-LLM/opc-annealing-corpus"     # 生ソースコード断片 (合成、多言語)
      name: "synthetic_code_snippet"
      weight: 0.02
    - path: "codeparrot/codeparrot-clean"            # GitHub Python 生ファイル (json.gz)
      text_column: "content"
      weight: 0.03
    - path: "HuggingFaceTB/finemath"    # 数学 web (inline LaTeX)
      name: "finemath-4plus"
      weight: 0.02
    - path: "open-web-math/open-web-math"            # 数学 web (inline LaTeX、$...$ 多め)
      weight: 0.02
    - path: "json"                                   # arXiv LaTeX 本文 (\section, \begin{figure} ...)
      # EleutherAI/proof-pile-2 は script 型で datasets 4.x が直接読めないため生ファイル指定。
      # .jsonl.zst の展開に zstandard が必要 (requirements.txt)。
      data_files: "hf://datasets/EleutherAI/proof-pile-2/arxiv/train/*.jsonl.zst"
      weight: 0.02
    - path: "injaeryou/mermaid_samples_13k"          # ```mermaid フェンス付き図 (2.6MB と小さいので上限付き)
      split: "wrapped"
      weight: 0.01
      max_epochs: 3
  streaming: true
  packing: document
  eos_token_id: 2
  pad_token_id: 3
  shuffle_buffer: 2000
  context_length: 8192      # 本走の context に合わせる (max_bytes は buffer 上限)
  num_workers: 0
  pin_memory: true

optim:
  optimizer: adamw
  state_precision: fp32     # choices: fp32 | int8 | bf8。全parameterのmoment stateへ一様適用
  lr: 3.0e-4
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.0
  grad_clip: 1.0
  scheduler: cosine_warmup
  min_lr_ratio: 0.05            # lr 下限 = ピークの 5%
  decay_end_ratio: 0.6          # 総 step の 60% で下限到達、残りは下限で一定
  warmup_steps: 1000
  total_steps: 500000

speed:
  device: auto              # choices: auto | cuda | mps | cpu
  precision: bf16           # 計算dtype。choices: bf16 | fp16 | fp32 (bf8 非対応)
  tf32_matmul: true
  cudnn_benchmark: false
  torch_compile: true
  cuda_prefetch: true
  sync_each_step: false
  micro_batch_size: 8
  grad_accum_steps: 1

checkpoint:
  dir: ./checkpoints/entropy_lm
  save_every_steps: 1500
  keep_last_k: 2
  async_save: false

sampling:
  enabled: false            # 境界判定用 LM なので生成品質は見ない

logging:
  log_every_steps: 50
  throughput_window: 50
