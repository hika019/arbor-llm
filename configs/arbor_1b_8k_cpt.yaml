# Arbor v2 1B / 8192 bytes 継続事前学習 (CPT: Continual Pre-Training)
#
# base (checkpoints/arbor2_1b_8k_filter, step 120893) は容量の床 (val bpb 1.12) に
# 到達済み。同じデータで延ばしても伸びないため、データ mix を「生 web を減らし
# Wikipedia/教科書/合成密度データを増やす」方向に組み替えて継続学習する。
# 目的は容量の天井を上げることではなく、限られた容量を知識密度の高いデータに
# 使わせて「流暢だが事実誤り」を減らすこと (天井を上げるならモデル拡大が別レバー)。
#
# 起動 (重みのみロード, optimizer/scheduler/step は 0 から):
#   source scripts/env.sh
#   python -m src.train.train --config configs/arbor_1b_8k_cpt.yaml \
#     --init-from checkpoints/arbor2_1b_8k_filter/latest
# 中断からの再開 (この run の checkpoint から):
#   python -m src.train.train --config configs/arbor_1b_8k_cpt.yaml --resume latest

run_name: arbor2_1b_8k_cpt
seed: 42

# ---- モデル: base と完全同一形状 (--init-from の strict ロード条件) ----
model:
  vocab_size: 260
  patching_mode: static
  patch_size: 8
  max_bytes: 8192
  hidden_size: 2048
  num_heads: 16
  num_kv_heads: 4
  intermediate_size: 5632
  num_hidden_layers: 20
  local_hidden_size: 768
  local_num_heads: 12
  local_num_kv_heads: 12
  local_intermediate_size: 2048
  num_local_encoder_layers: 2
  num_local_decoder_layers: 4
  rope_theta: 500000.0
  norm_eps: 1.0e-5
  bitnet: true
  gradient_checkpointing: false

# ---- データ: 密度重視 mix (生 web↓ / 百科・教科書・合成↑) ----
data:
  sources:
    # 日本語 web = 教育スコアで足切りした fineweb-2 (edu 版)。min_score で初めて
    # ノイズ web が落ちて「教育フィルタ版」として機能する (無指定なら生と同じ)。
    - id: fineweb2_edu_ja
      path: "hotchpotch/fineweb-2-edu-japanese"
      revision: main
      license_policy: "derived from fineweb-2 (CC); edu-scored subset"
      weight_bytes: 0.30
      min_score: 3.0
      score_column: "score"
      text_filter:
        preset: ja_web_v1
    - id: wikipedia_ja
      path: "wikimedia/wikipedia"
      name: "20231101.ja"
      revision: main
      license_policy: "CC BY-SA/GFDL attribution requirements"
      weight_bytes: 0.18
    # 日本語 合成教科書 (phi 系高密度)。100k 件と小さいので epoch を制限。
    - id: cosmopedia_ja
      path: "aixsatoshi/cosmopedia-japanese-100k"
      text_column: "japanese"
      revision: main
      license_policy: "synthetic (Mixtral-generated); dataset card terms"
      weight_bytes: 0.06
      max_epochs: 3
    # 日本語 Wikibooks (説明的プロース=教科書体)
    - id: wikibook_ja
      path: "hatakeyama-llm-team/WikiBookJa"
      text_column: "text"
      revision: main
      license_policy: "CC BY-SA (Wikibooks)"
      weight_bytes: 0.02
      max_epochs: 3
    - id: aozora_modern
      path: "globis-university/aozorabunko-clean"
      revision: main
      license_policy: "Aozora public-domain/copyright-expired texts"
      weight_bytes: 0.02
      max_epochs: 3
    - id: japan_law
      path: "y2lan/japan-law"
      text_column: "body"
      revision: main
      license_policy: "Japanese government legal text terms"
      weight_bytes: 0.005
      max_epochs: 5
    # 英語 edu (高品質土台)
    - id: fineweb_edu_en
      path: "HuggingFaceFW/fineweb-edu"
      revision: main
      license_policy: "dataset card terms; web crawl mixture"
      weight_bytes: 0.10
    # 英語 合成教科書 (Cosmopedia web_samples_v2 = 最大サブセット)
    - id: cosmopedia_en
      path: "HuggingFaceTB/cosmopedia"
      name: "web_samples_v2"
      revision: main
      license_policy: "synthetic (Mixtral-generated); Apache-2.0"
      weight_bytes: 0.06
    # 数学 (web 由来の高品質 + Swallow Math)
    - id: finemath_4plus
      path: "HuggingFaceTB/finemath"
      name: "finemath-4plus"
      revision: main
      license_policy: "dataset card terms; math web mixture"
      weight_bytes: 0.045
      text_filter:
        preset: en_web_quality_v1
    - id: swallow_math
      path: "tokyotech-llm/swallow-math"
      text_column: "text"
      revision: main
      license_policy: "dataset card terms"
      weight_bytes: 0.03
    # コード (既存の filter 済み + コード解説 web)
    - id: github_code_filtered
      path: "loubnabnl/github-code-more-filtering"
      text_column: "code"
      revision: main
      license_policy: "per-file licenses only; exclude generated/vendor/secrets/duplicates"
      weight_bytes: 0.08
    - id: opc_code_web
      path: "OpenCoder-LLM/opc-fineweb-code-corpus"
      revision: main
      license_policy: "dataset card terms; code/web mixture"
      weight_bytes: 0.01
      text_filter:
        preset: en_web_quality_v1
  streaming: true
  packing: document
  eos_token_id: 2
  pad_token_id: 3
  shuffle_buffer: 2000
  context_length: 8192
  num_workers: 0
  prefetch_factor: 4
  pin_memory: true

# ---- 最適化: 継続学習は base ピークより低い lr・短い step ----
optim:
  optimizer: bnb_adamw_8bit
  lr: 1.0e-4                     # base ピーク 2e-4 の 1/2。新 mix を吸収しつつ既習を壊さない
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.1
  grad_clip: 1.0
  scheduler: cosine_warmup
  min_lr_ratio: 0.1
  decay_end_ratio: 1.0           # 全 step かけて下限へ減衰
  warmup_steps: 500
  total_steps: 20000             # ~5.2s/step で約29h。base 120k の ~17% ≈ 継続学習の妥当域

# ---- スループット (base と同一) ----
speed:
  precision: bf16
  tf32_matmul: true
  cudnn_benchmark: true
  torch_compile: true
  compile_mode: default
  cuda_prefetch: true
  cpu_prefetch_depth: 3
  bitnet_weight_cache: auto
  bitnet_weight_cache_gib: 1.25
  bitnet_weight_cache_min_numel: 65536
  sync_each_step: false
  micro_batch_size: 2
  grad_accum_steps: 32

# ---- validation: base と同一ドメイン (bpb を base run と比較可能に保つ) ----
validation:
  enabled: true
  max_batches: 64
  micro_batch_size: 2
  domains:
    ja_web:
      source: "HuggingFaceFW/fineweb-2"
      name: "jpn_Jpan"
      revision: main
      split: train
      skip_samples: 200000
    wikipedia_ja:
      source: "wikimedia/wikipedia"
      name: "20231101.ja"
      revision: main
      split: train
      skip_samples: 20000
    english:
      source: "HuggingFaceFW/fineweb-edu"
      revision: main
      split: train
      skip_samples: 200000
    math:
      source: "HuggingFaceTB/finemath"
      name: "finemath-4plus"
      revision: main
      split: train
      skip_samples: 20000
    code:
      source: "loubnabnl/github-code-more-filtering"
      text_column: "code"
      revision: main
      split: train
      skip_samples: 20000

checkpoint:
  dir: ./checkpoints/arbor2_1b_8k_cpt   # 実体は /home/hi/checkpoints (ext4) へのsymlink
  save_every_steps: 1000
  keep_last_k: 3
  keep_every_n_steps: 10000
  async_save: true

sampling:
  enabled: true
  prompts:
    - "日本の四季は"
    - "The most important thing in life is"
    - "def fibonacci(n):"
  max_new_bytes: 100
  temperature: 0.8
  top_p: 0.95
  seed: 42
  use_cache: true

probes:
  enabled: true
  items:
    - name: ja_seasons
      prompt: "日本には春、夏、秋、冬という四つの季節があり、"
      target: "それぞれに異なる気候と風景を楽しむことができる。"
      bad_targets:
        - "あっという間においしくなった。"
        - "天然記念物になるという。"
    - name: ja_buttons
      prompt: "この装置には赤、青、緑、黄色という四つのボタンがあり、"
      target: "それぞれに異なる機能が割り当てられている。"
      bad_targets:
        - "あっという間においしくなった。"
        - "天然記念物になるという。"

logging:
  wandb_project: arbor-llm
  log_every_steps: 20
  throughput_window: 50
  byte_kind_metrics: true
  best_ema_decay: 0.98
